# Docker-first stack: `docker compose up --build` brings up Postgres,
# the FastAPI backend, and the nginx-served React frontend.
#
# Required env (see .env.example):
#   POSTGRES_PASSWORD - password for the `beans` Postgres role
#   BEANS_CONFIG_DIR  - host dir containing config.yaml (defaults to ./config)
#   BEANS_LEDGER_DIR  - host dir containing the .beancount file referenced by config.yaml
#
# Optional:
#   IMAGE_REPO        - image-name prefix; matches the names used by GitHub
#                       Actions so a pulled image and a locally-built one are
#                       interchangeable (e.g. ghcr.io/owner/beans).
#   FRONTEND_PORT     - host port for the nginx frontend (default 80).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: beans
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beans}
      POSTGRES_DB: beans
    volumes:
      - beans-pg-data:/var/lib/postgresql/data
    # Not published on the host by default; backend reaches it over the
    # compose network. Uncomment to connect from your laptop with psql.
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beans -d beans"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: ${IMAGE_REPO:-beans}-back:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - HOME=/root
      - DATABASE_URL=postgres://beans:${POSTGRES_PASSWORD:-beans}@db:5432/beans
    expose:
      - "8000"
    volumes:
      # config.yaml lives at ~/.config/beans/config.yaml inside the container.
      - ${BEANS_CONFIG_DIR:-./config}:/root/.config/beans
      # Ledger directory referenced by `ledger:` in config.yaml.
      - ${BEANS_LEDGER_DIR:-./ledger}:/data/ledger

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: ${IMAGE_REPO:-beans}-front:latest
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  beans-pg-data:
